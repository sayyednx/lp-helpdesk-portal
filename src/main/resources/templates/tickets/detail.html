<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${ticket.number})}"></head>
<body>
<header th:replace="~{fragments/layout :: header('mine')}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <p><a th:href="@{/tickets}">← My tickets</a></p>
    <div class="page-head">
        <div>
            <p class="mono muted" th:text="${ticket.number}">LP-00001</p>
            <h1 th:text="${ticket.subject}">Subject</h1>
        </div>
        <span class="pill" style="font-size:14px;padding:6px 14px"
              th:classappend="${ticket.status.css}" th:text="${ticket.status.label}">Open</span>
    </div>

    <div class="grid-2">
        <div>
            <div class="card">
                <h3>What you told us</h3>
                <div class="description" th:text="${ticket.description}">Details</div>
            </div>

            <div class="card">
                <h3>Conversation</h3>
                <p class="muted small" th:if="${ticket.comments.isEmpty()}">No replies yet. You'll get an email when the team answers.</p>
                <div class="thread">
                    <div class="msg" th:each="c : ${ticket.comments}" th:classappend="${c.author.admin} ? 'staff'">
                        <div class="avatar" th:text="${c.author.initials}">AB</div>
                        <div class="bubble">
                            <span class="who" th:text="${c.author.admin} ? ${c.author.fullName} + ' · Help desk' : ${c.author.fullName}">Name</span>
                            <span class="when" th:text="${#temporals.format(c.createdAt, 'MMM d, h:mm a')}">time</span>
                            <div class="text" th:text="${c.message}">Message</div>
                        </div>
                    </div>
                </div>

                <form th:if="${ticket.status.name() != 'CLOSED'}" th:action="@{/tickets/{id}/comments(id=${ticket.id})}" method="post">
                    <div class="field">
                        <label for="message">Add a message</label>
                        <textarea id="message" name="message" maxlength="5000" style="min-height:90px"
                                  placeholder="Add more details or answer a question from the team"></textarea>
                    </div>
                    <button class="btn" type="submit">Send message</button>
                </form>
            </div>
        </div>

        <aside class="card">
            <h3>Details</h3>
            <dl class="meta">
                <dt>Team</dt><dd th:text="${ticket.category.displayName}">IT</dd>
                <dt>Type</dt><dd th:text="${ticket.requestType}">Laptop</dd>
                <dt>Priority</dt><dd><span class="pill" th:classappend="${ticket.priority.css}" th:text="${ticket.priority.label}">Medium</span></dd>
                <dt>Sent</dt><dd th:text="${#temporals.format(ticket.createdAt, 'MMM d, yyyy h:mm a')}">date</dd>
                <dt>Updated</dt><dd th:text="${#temporals.format(ticket.updatedAt, 'MMM d, yyyy h:mm a')}">date</dd>
            </dl>
            <form th:if="${ticket.status.active}" th:action="@{/tickets/{id}/close(id=${ticket.id})}" method="post" style="margin-top:20px"
                  onsubmit="return confirm('Close this ticket? Only do this if your problem is fixed.');">
                <button class="btn danger block" type="submit">My problem is fixed - close ticket</button>
            </form>
        </aside>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
